name: One-time Account Hub Prettier normalization

on:
  push:
    branches:
      - feature/b2b-store-sales-shared-cart
    paths:
      - .github/workflows/format-account-hub-once.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only new Account Hub changes
        run: |
          npx prettier --write .github/workflows/format-account-hub-once.yml src/App.jsx src/pages/AccountPage.jsx src/pages/accountIdentityUi.test.js
          npm run format:check
          git diff --check
      - name: Verify before committing
        run: |
          npm run lint
          npm run build
          npm test
      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/pages/AccountPage.jsx src/pages/accountIdentityUi.test.js
          if ! git diff --cached --quiet; then
            git commit -m "style(mobile): normalize Account Hub routes and UI tests"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
