name: One-time Fast Order formatting

on:
  push:
    branches:
      - feature/b2b-store-sales-shared-cart
    paths:
      - .github/workflows/format-b2b-fastorder-once.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prettier changed field-order files
        run: |
          npx prettier --write .github/workflows/format-b2b-fastorder-once.yml src/App.jsx src/components/layout/Navbar.css src/components/layout/Navbar.jsx src/data/fastOrder.js src/data/fastOrder.test.js src/data/sharedDraftWhatsApp.js src/data/sharedDraftWhatsApp.test.js src/pages/FastOrderPage.css src/pages/FastOrderPage.jsx src/pages/fastOrderUi.test.js
          npm run format:check
          git diff --check
      - name: Check build, lint and automated tests
        run: |
          npm run lint
          npm run build
          npm test
      - name: Commit only verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/components/layout/Navbar.css src/components/layout/Navbar.jsx src/data/fastOrder.js src/data/fastOrder.test.js src/data/sharedDraftWhatsApp.js src/data/sharedDraftWhatsApp.test.js src/pages/FastOrderPage.css src/pages/FastOrderPage.jsx src/pages/fastOrderUi.test.js
          if ! git diff --cached --quiet; then
            git commit -m "style(b2b): format context-first header and fast order matrix"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
