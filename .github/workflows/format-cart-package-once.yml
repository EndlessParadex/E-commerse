name: One-time Cart Package Switch formatting

on:
  push:
    branches:
      - feature/b2b-store-sales-shared-cart
    paths:
      - .github/workflows/format-cart-package-once.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed B2B cart item files
        run: |
          npx prettier --write .github/workflows/format-cart-package-once.yml server/cartPackageSwitch.test.js server/sharedCarts.js src/components/shop/SharedCartPage.css src/components/shop/SharedCartPage.jsx
          npm run format:check
          git diff --check
      - name: Validate code before formatting commit
        run: |
          npm run lint
          npm run build
          npm test
      - name: Commit only verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/cartPackageSwitch.test.js server/sharedCarts.js src/components/shop/SharedCartPage.css src/components/shop/SharedCartPage.jsx
          if ! git diff --cached --quiet; then
            git commit -m "style(b2b): format compact cart and atomic package switching"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
