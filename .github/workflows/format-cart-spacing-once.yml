name: One-time Shared Cart layout formatting

on:
  push:
    branches:
      - feature/b2b-store-sales-shared-cart
    paths:
      - .github/workflows/format-cart-spacing-once.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed cart layout files
        run: |
          npx prettier --write .github/workflows/format-cart-spacing-once.yml src/components/shop/SharedCartPage.css src/components/shop/SharedDeliveryCalendar.jsx
          npm run format:check
          git diff --check
      - name: Check quality
        run: |
          npm run lint
          npm run build
          npm test
      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/shop/SharedCartPage.css src/components/shop/SharedDeliveryCalendar.jsx
          if ! git diff --cached --quiet; then
            git commit -m "style(b2b): normalize compact calendar and cart actions"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
