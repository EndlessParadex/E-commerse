name: One-time shared cart Prettier normalization

on:
  push:
    branches:
      - feature/b2b-store-sales-shared-cart
    paths:
      - .github/workflows/format-shared-cart-once.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format new shared-cart changes
        run: |
          npx prettier --write server/cartReviewRequest.test.js server/sharedCarts.js src/components/shop/AdminCartProcessing.jsx src/components/shop/SharedCartPage.css src/components/shop/SharedCartPage.jsx src/data/sharedDraftWhatsApp.js src/data/sharedDraftWhatsApp.test.js src/pages/sharedCartUi.test.js docs/FINALISASI-B2B.md
          npm run format:check
          git diff --check
      - name: Verify before committing
        run: |
          npm run lint
          npm run build
          npm test
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/cartReviewRequest.test.js server/sharedCarts.js src/components/shop/AdminCartProcessing.jsx src/components/shop/SharedCartPage.css src/components/shop/SharedCartPage.jsx src/data/sharedDraftWhatsApp.js src/data/sharedDraftWhatsApp.test.js src/pages/sharedCartUi.test.js docs/FINALISASI-B2B.md
          if ! git diff --cached --quiet; then
            git commit -m "style(b2b): normalize shared cart field UI and tests"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
# Repeat after restoring Admin legacy quantity editor for stable regression coverage.
